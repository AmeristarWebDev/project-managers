<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Territory Map</title>

  <!-- Leaflet CSS + JS from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* State name labels (rendered directly on the map) */
    .state-label {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-shadow:
        0 0 3px rgba(0,0,0,0.8),
        0 0 2px rgba(0,0,0,0.9),
        1px 1px 0 rgba(0,0,0,0.6),
        -1px -1px 0 rgba(0,0,0,0.6);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: 0.3px;
      width: max-content;
    }
    .state-label-small { font-size: 10px; }

    /* Info panel (top right) */
    .info {
      padding: 8px 12px;
      background: white;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.4;
    }
    .info h4 { margin: 0 0 6px; color: #333; }

    /* Popup styling */
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
    .popup-content h3 {
      margin: 0 0 3px;
      font-size: 16px;
      color: #222;
    }
    .popup-content .territory-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eee;
    }
    .popup-content .role-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin: 8px 0 5px;
      font-size: 11px;
    }
    .popup-content .pm-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .popup-content .pm {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
    }
    .popup-content .pm img,
    .popup-content .pm .pm-placeholder {
      width: clamp(52px, 15vw, 64px);
      height: clamp(52px, 15vw, 64px);
      border-radius: 8px;
      object-fit: cover;
      object-position: center top;
      border: 2px solid #eee;
      background: #f5f5f5;
      image-rendering: -webkit-optimize-contrast;
    }
    .popup-content .pm .pm-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #888;
    }
    .popup-content .pm-role {
      font-size: 10px;
      color: #999;
      text-align: center;
      line-height: 1.15;
      margin-top: 1px;
      max-width: 72px;
    }
    /* DCM column is wide (two-line title) — let the card and name use it,
       so long names like Phornsutiphaijit wrap to two lines, not three.
       Left-justify the headshot + name so they align with the label above. */
    .popup-content .dcm-section .pm { width: auto; min-width: 72px; align-items: flex-start; }
    .popup-content .dcm-section .pm-name { max-width: 150px; text-align: left; }
    .popup-content .pm-name {
      font-size: 12px;
      font-weight: 500;
      color: #333;
      margin-top: 4px;
      text-align: center;
      line-height: 1.2;
      overflow-wrap: break-word;
      hyphens: auto;
      max-width: 72px;
    }
    .popup-content .ts-line {
      margin-top: 8px;
      font-size: 13px;
      color: #333;
    }
    .popup-content .popup-phone {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 15px;
    }
    .popup-content .md-dcm-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    /* MD and DCM side by side on the top row; DCM title wraps to 3 lines.
       On desktop the MD row keeps its natural single-line width so Leaflet
       measures the popup correctly even before images load. */
    .md-dcm-row .md-section { flex: 0 1 auto; min-width: 0; }
    .md-dcm-row .dcm-section { flex: 0 0 auto; }
    @media (min-width: 540px) {
      .popup-content .md-dcm-row { flex-wrap: nowrap; } /* Chrome sizes wrap-rows to largest item; nowrap makes it sum MD + DCM */
      .md-dcm-row .md-section .pm-row { min-width: max-content; }
    }
    /* keep popups on-screen for phones; interior flex wraps to fit */
    .leaflet-popup-content { max-width: min(530px, 94vw) !important; }

    .popup-content .popup-phone a {
      color: #1a2c8c;
      text-decoration: none;
      font-weight: 700;
    }
    .popup-content .popup-phone a:hover { text-decoration: underline; }
    .popup-content .popup-email {
      text-align: center;
      font-size: 15px;
      margin-top: 6px;
    }
    .popup-content .popup-email a {
      color: #1a2c8c;
      text-decoration: none;
      font-weight: 500;
    }
    .popup-content .popup-email a:hover { text-decoration: underline; }
    .popup-content .md-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .popup-content .md-name {
      font-size: 13px;
      color: #444;
      padding: 2px 0;
    }

    /* Sales Regions popup */
    .region-popup h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }
    .region-badge {
      display: inline-block;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border-radius: 3px;
      margin-bottom: 14px;
    }
    .region-director {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      margin-bottom: 10px;
    }
    .region-title {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .region-contact {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .region-contact a {
      color: #1a2c8c;
      text-decoration: none;
    }
    .region-contact a:hover { text-decoration: underline; }

    /* Legend (bottom right) */
  </style>
</head>
<body>
  <div id="map"></div>
